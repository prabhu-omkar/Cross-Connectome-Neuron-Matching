# Control C5 on the GNN: training positives randomly re-paired. No validation-based checkpoint choice
# (val uses TRUE labels); trains to gnn_L2's median best step (800; LR schedule spans 3000), keeps final weights.
name: gnn_L2_C5
model: {layers: 2, width: 256, out_dim: 128, dropout: 0.1, direction: directed}
train: {max_steps: 3000, eval_every: 100, patience: 5, checkpoint_every: 200, select: last, stop_at: 800}
controls: {label_permute: true}
