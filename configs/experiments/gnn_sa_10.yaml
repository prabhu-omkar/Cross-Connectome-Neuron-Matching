# Seed ablation (plan 7.4.1): gnn_L2 trained on 10% of training families, nested draw r = seed r.
# Run with --seeds 0,1,2. The 100% point is gnn_L2 itself (patience 5: replaying the gnn_L2 curves gives the identical best checkpoint, results/patience_sim.csv).
