[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flymatch"
version = "0.1.0"
description = "Cross-connectome neuron matching between BANC (female) and MaleCNS (male) Drosophila connectomes"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
readme = "README.md"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "matplotlib",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]
gnn = ["torch", "torch_geometric", "umap-learn"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/prabhu-omkar/Cross-Connectome-Neuron-Matching"
